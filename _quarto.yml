project:
  type: website
  output-dir: _site

website:
  title: "Roger Ribeiro"
  site-url: "https://rogership.github.io"
  description: "Redes · Segurança · Deep Learning"
  favicon: assets/favicon.ico

  navbar:
    left:
      - text: "Blog"
        href: blog/index.qmd
      - text: "Writeups"
        href: writeups/index.qmd
      - text: "Projetos"
        href: projects/index.qmd
      - text: "Livros"
        href: livros/index.qmd
      - text: "Sobre"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/rogership

  page-footer:
    center: "Roger Ribeiro · Feito com [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
